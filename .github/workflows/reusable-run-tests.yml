name: Reusable Test Runner

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cloudflare Worker Dependencies
        run: cd cloudflare-workers && npm ci

      - name: Install MCP Bridge Dependencies
        run: cd cloudflare-workers/mcp-bridge && npm ci

      - name: Run main project tests
        run: npm run test

      - name: Verify Build
        run: npm run build

      - name: Verify Cloudflare Worker Build
        run: |
          cd cloudflare-workers
          npm run check
          cd mcp-bridge
          npm test
          npm run dry-run
