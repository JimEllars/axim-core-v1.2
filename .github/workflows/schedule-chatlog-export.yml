name: Export Chatlogs to Google Drive

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - name: Install Dependencies
        run: npm ci


      - name: Verify Google Drive Configuration
        run: |
          if [ -z "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" ] || [ -z "${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" ]; then
            echo "⚠️ Google Drive credentials not configured. Gracefully skipping export to prevent CI failure."
            exit 0
          fi
          echo "✅ Google Drive secrets configured"


      - name: Export Chatlogs
        run: node scripts/export-chatlogs.js
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        timeout-minutes: 10
