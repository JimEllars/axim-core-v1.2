# The two machine-facing robotics endpoints need the signed-relay form
# (X-Axim-Signature over the raw body, no bearer token), which the platform JWT
# check rejects before the function runs. Both decide for themselves via
# `classifyEdgeCaller` + `authorizeQueueDrain` / `authorizeRoboticsOperation`,
# and refuse every anonymous caller. The operator-facing robotics functions
# (`robotics-projects`, `robotics-sim`) keep the platform default so a caller
# without a valid JWT never reaches function code at all.
[functions.robotics-emergency-stop]
verify_jwt = false

[functions.robotics-sim-drainer]
verify_jwt = false

# The three MCP transports need callers that are not JWT bearers: a satellite
# presents a signed relay (X-Axim-Signature over the raw body), and Onyx presents
# the internal service key. The platform JWT check rejects both before function
# code runs, so it is disabled here and the function decides instead — every one
# of them refuses anonymous callers through `classifyEdgeCaller`, including the
# discovery document, and `mcp-message` additionally requires a signed session.
[functions.mcp-router]
verify_jwt = false

[functions.mcp-sse]
verify_jwt = false

[functions.mcp-message]
verify_jwt = false
